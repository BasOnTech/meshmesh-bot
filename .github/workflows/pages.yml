# Builds every board and the site, then publishes them to GitHub Pages.
name: Site and firmware

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python tools/build/version.py --check
          python tools/gen/i18n.py check
          npm ci --prefix tools
          node tools/gen/web_i18n.cjs check

  firmware:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        env: [m9, heltec_v4, heltec_v4_r8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-
      - run: pip install platformio esptool
      - run: pio run -e ${{ matrix.env }}
      - run: python tools/build/package.py ${{ matrix.env }}
      # The screens in every interface language for the site (host build of the UI; needs the m9 libraries).
      # Required: do not silently publish old screenshots when generation fails.
      - if: matrix.env == 'm9'
        run: pip install pillow && python tools/site/site_shots.py artifacts/site-shots
      # Host checks against the real sources (tests/run.sh; needs the m9 libraries): MM/1 packets, chess rules, rated
      # results and the companion page, checkers and sea battle between two host copies of src/games/duel/Duel.cpp.
      - if: matrix.env == 'm9'
        run: sh tests/run.sh
      # The device page in every language (made-up data, headless Chrome of the runner).
      - if: matrix.env == 'm9'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-core fonts-noto-cjk
          CHROME=$(command -v google-chrome) python tools/site/web_shots.py artifacts/web-shots
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.env }}
          path: artifacts/

  site:
    needs: firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: artifacts
          merge-multiple: true
      - run: python tools/gen/i18n.py check
      - run: |
          python tools/site/pages.py _site m9 heltec_v4 heltec_v4_r8
          python tools/site/publish_check.py _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish only the current main revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$(gh api repos/$GITHUB_REPOSITORY/branches/main --jq .commit.sha)" = "$GITHUB_SHA"
      - id: deployment
        uses: actions/deploy-pages@v4
