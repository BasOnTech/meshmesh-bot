[platformio]
default_envs = m9

[env]
; pio_web.py: the device page and its languages for the ESP32 boards' web server (src/net/Portal.cpp)
extra_scripts = pre:tools/build/pio_version.py, pre:tools/build/pio_web.py

; Flags every board shares; the envs reference them as ${common.…} so the copies cannot drift apart.
[common]
build_flags =
  -D MAX_CONTACTS=24
  -D MAX_GROUP_CHANNELS=8
  -D ENV_INCLUDE_GPS=1
  -D RADIOLIB_STATIC_ONLY=1
; Transceivers neither board carries
radiolib_exclude =
  -D RADIOLIB_EXCLUDE_CC1101=1
  -D RADIOLIB_EXCLUDE_RF69=1
  -D RADIOLIB_EXCLUDE_SX1231=1
  -D RADIOLIB_EXCLUDE_SI443X=1
  -D RADIOLIB_EXCLUDE_RFM2X=1
  -D RADIOLIB_EXCLUDE_SX128X=1

[env:m9]
platform = platformio/espressif32@6.11.0
framework = arduino
board = meshmesh_m9
monitor_speed = 115200
; CH340 (M9): writes verified at 460800; 921600 broke off on long transfers (docs/verification.md)
upload_speed = 460800
build_src_filter = +<*> -<hw/HardwareHeltec.cpp> -<ui/UiHeltec.cpp>
board_build.partitions = partitions.csv
; Warnings for our sources only (src/), not for the libraries and the core. Inherited by heltec_v4. misleading-indentation is off: "if(x)return;y();" on one line is the house style, not a bug.
build_src_flags = -Wall -Wno-misleading-indentation
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -D ARDUINO_USB_CDC_ON_BOOT=0
  -D BOARD_HAS_PSRAM
  -D CORE_DEBUG_LEVEL=0
  ${common.build_flags}
  ${common.radiolib_exclude}
lib_deps =
  rweather/Crypto@0.4.0
  jgromes/RadioLib@7.8.1
  ; Pinned before the ST7789 library, which takes any GFX version: 2.0.0 moved its sources (tools/ui_preview/build.sh)
  adafruit/Adafruit GFX Library@1.13.0
  adafruit/Adafruit ST7735 and ST7789 Library@1.11.0
  olikraus/U8g2_for_Adafruit_GFX@1.8.0
  mikalhart/TinyGPSPlus@1.0.3
  adafruit/RTClib@2.1.4
  bblanchon/ArduinoJson@6.21.5
  h2zero/NimBLE-Arduino@1.4.3

[env:heltec_v4]
extends = env:m9
board = meshmesh_heltec_v4
build_unflags = ${env:m9.build_unflags} -D ARDUINO_USB_CDC_ON_BOOT=0
build_flags =
  -std=gnu++17
  -D MM_HELTEC_V4=1
  -D MM_COMPACT=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -D BOARD_HAS_PSRAM
  -D CORE_DEBUG_LEVEL=0
  ${common.build_flags}
build_src_filter = +<*> -<hw/Hardware.cpp> -<ui/Ui.cpp> -<games/solitaire/Solitaire.cpp>
lib_deps =
  ${env:m9.lib_deps}
  adafruit/Adafruit SSD1306@2.5.15

[env:heltec_v4_r8]
extends = env:heltec_v4
board = meshmesh_heltec_v4_r8
build_flags = ${env:heltec_v4.build_flags} -D MM_HELTEC_R8=1
